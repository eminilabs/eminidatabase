<VirtualHost *:80>
    ServerName database.eminilabs.org
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:3091/
    ProxyPassReverse / http://127.0.0.1:3091/
    ErrorLog ${APACHE_LOG_DIR}/eminidatabase-frontend-error.log
    CustomLog ${APACHE_LOG_DIR}/eminidatabase-frontend-access.log combined
</VirtualHost>
