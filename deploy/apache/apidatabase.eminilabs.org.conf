<VirtualHost *:80>
    ServerName apidatabase.eminilabs.org
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8091/
    ProxyPassReverse / http://127.0.0.1:8091/
    ErrorLog ${APACHE_LOG_DIR}/eminidatabase-backend-error.log
    CustomLog ${APACHE_LOG_DIR}/eminidatabase-backend-access.log combined
</VirtualHost>
