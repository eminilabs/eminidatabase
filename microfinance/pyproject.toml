[project]
name = "eminidatabase-microfinance"
version = "0.1.0"
description = "Microfinance business application built on top of the eminidatabase Cloud Database Platform"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: FastAPI's Depends() as a default value is the idiomatic pattern (same
# justified exception as backend/ and sdk/).
ignore = ["B008"]
